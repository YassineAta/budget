name: Fetch NAV Data

on:
  schedule:
    # CMF publishes the previous day's NAV file at an irregular time — poll a few times per business day.
    # Commits (and redeploys) only happen when a NAV actually changes.
    - cron: '0 8,11,14,17,20 * * 1-5'
    - cron: '0 10 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml (pushes made with GITHUB_TOKEN don't trigger push workflows)

concurrency:
  group: fetch-nav
  cancel-in-progress: false

jobs:
  fetch-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch NAV data from CMF
        run: node scripts/fetch-nav.mjs

      - name: Commit, push and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/nav-data.json
          if git diff --staged --quiet; then
            echo "No NAV changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(nav): update daily NAV data from CMF'
          git pull --rebase origin main
          git push
          gh workflow run deploy.yml --ref main

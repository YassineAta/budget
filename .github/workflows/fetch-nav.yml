name: Fetch NAV Data

on:
  schedule:
    # 5pm UTC Mon-Fri — after Tunisian market close when NAV is published
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch NAV data
        run: node scripts/fetch-nav.js

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/nav-data.json
          git diff --staged --quiet && echo "No NAV changes" || (
            git commit -m 'chore(nav): update daily NAV data' &&
            git push
          )
